<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      @keyframes rotate-slow { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
      @keyframes rotate-rev  { from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
      @keyframes drift1 { 0%,100%{transform:translate(0,0);} 33%{transform:translate(14px,-10px);} 66%{transform:translate(-8px,12px);} }
      @keyframes fadeUp { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
      @keyframes pathFlow { from{stroke-dashoffset:200;} to{stroke-dashoffset:0;} }
      @keyframes nodePop { 0%,100%{r:2.5;opacity:0.7;} 50%{r:4.5;opacity:1;} }
      @keyframes lineGlow { 0%,100%{opacity:0.2;} 50%{opacity:0.5;} }
      .proj1{animation:fadeUp 0.7s ease-out 0.1s both;}
      .proj2{animation:fadeUp 0.7s ease-out 0.25s both;}
      .proj3{animation:fadeUp 0.7s ease-out 0.4s both;}
      .proj4{animation:fadeUp 0.7s ease-out 0.55s both;}
    </style>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#060507"/>
      <stop offset="100%" stop-color="#0C0A08"/>
    </linearGradient>
    <radialGradient id="rg7" cx="25%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#B84021" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg8" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#2BBFB0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>
    <filter id="b2p"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b5p"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip4"><rect width="900" height="160"/></clipPath>
  </defs>

  <g clip-path="url(#clip4)">
    <rect width="900" height="160" fill="url(#bg4)"/>
    <rect width="900" height="160" fill="url(#rg7)"/>
    <rect width="900" height="160" fill="url(#rg8)"/>

    <!-- Circuit-board style lines -->
    <!-- Horizontal tracks -->
    <line x1="0" y1="30"  x2="900" y2="30"  stroke="#B84021" stroke-width="0.4" stroke-dasharray="6 14" opacity="0.22" style="animation:lineGlow 3s ease-in-out infinite;"/>
    <line x1="0" y1="80"  x2="900" y2="80"  stroke="#D4903A" stroke-width="0.3" stroke-dasharray="4 18" opacity="0.18" style="animation:lineGlow 4s ease-in-out infinite 1s;"/>
    <line x1="0" y1="130" x2="900" y2="130" stroke="#2BBFB0" stroke-width="0.4" stroke-dasharray="5 16" opacity="0.2"  style="animation:lineGlow 5s ease-in-out infinite 2s;"/>

    <!-- Vertical tracks -->
    <line x1="200" y1="0" x2="200" y2="160" stroke="#B84021" stroke-width="0.3" opacity="0.15" style="animation:lineGlow 5s ease-in-out infinite 0.5s;"/>
    <line x1="450" y1="0" x2="450" y2="160" stroke="#D4903A" stroke-width="0.3" opacity="0.15" style="animation:lineGlow 4s ease-in-out infinite 1.5s;"/>
    <line x1="700" y1="0" x2="700" y2="160" stroke="#2BBFB0" stroke-width="0.3" opacity="0.15" style="animation:lineGlow 6s ease-in-out infinite 0.8s;"/>

    <!-- Circuit nodes -->
    <circle cx="200" cy="30" r="2.5" fill="#B84021" style="animation:nodePop 2.5s ease-in-out infinite;"/>
    <circle cx="200" cy="80" r="2.5" fill="#D4903A" style="animation:nodePop 2.5s ease-in-out infinite 0.5s;"/>
    <circle cx="200" cy="130" r="2.5" fill="#2BBFB0" style="animation:nodePop 2.5s ease-in-out infinite 1s;"/>
    <circle cx="450" cy="30" r="2.5" fill="#D4903A" style="animation:nodePop 2.5s ease-in-out infinite 0.3s;"/>
    <circle cx="450" cy="130" r="2.5" fill="#B84021" style="animation:nodePop 2.5s ease-in-out infinite 1.3s;"/>
    <circle cx="700" cy="30" r="2.5" fill="#2BBFB0" style="animation:nodePop 2.5s ease-in-out infinite 0.8s;"/>
    <circle cx="700" cy="80" r="2.5" fill="#B84021" style="animation:nodePop 2.5s ease-in-out infinite 1.8s;"/>
    <circle cx="700" cy="130" r="2.5" fill="#D4903A" style="animation:nodePop 2.5s ease-in-out infinite 0.6s;"/>

    <!-- Traveling signal on circuit -->
    <circle cx="0" cy="30" r="2.5" fill="#B84021" opacity="0.9" filter="url(#b2p)">
      <animate attributeName="cx" values="0;900" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="130" r="2.5" fill="#2BBFB0" opacity="0.9" filter="url(#b2p)">
      <animate attributeName="cx" values="900;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Corner hexagons -->
    <g transform="translate(50,80)" style="transform-origin:50px 80px; animation:rotate-slow 18s linear infinite;">
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="#B84021" stroke-width="0.8" opacity="0.35"/>
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#D4903A" stroke-width="0.5" opacity="0.25"/>
    </g>
    <g transform="translate(850,80)" style="transform-origin:850px 80px; animation:rotate-rev 22s linear infinite;">
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="#2BBFB0" stroke-width="0.8" opacity="0.3"/>
    </g>

    <!-- Floating orbs -->
    <g style="animation:drift1 9s ease-in-out infinite; transform-origin:100px 80px;">
      <circle cx="100" cy="80" r="40" fill="#B84021" opacity="0.06" filter="url(#b5p)"/>
    </g>
    <g style="animation:drift1 11s ease-in-out infinite 3s; transform-origin:800px 80px;">
      <circle cx="800" cy="80" r="45" fill="#2BBFB0" opacity="0.06" filter="url(#b5p)"/>
    </g>

    <!-- Border -->
    <line x1="0" y1="1" x2="900" y2="1" stroke="#B84021" stroke-width="1" opacity="0.55"/>
    <line x1="0" y1="159" x2="900" y2="159" stroke="#D4903A" stroke-width="0.6" opacity="0.4"/>

    <!-- Section title -->
    <text x="450" y="26" text-anchor="middle" font-family="'Courier New', monospace" font-size="11"
          fill="#D4903A" letter-spacing="6" class="proj1">🚀  FEATURED PROJECTS  🚀</text>

    <!-- Project cards (4 across) -->
    <!-- Card 1: ME Portal -->
    <g class="proj2">
      <rect x="18" y="38" width="195" height="106" rx="5" fill="#0C0A08" opacity="0.8"/>
      <rect x="18" y="38" width="195" height="106" rx="5" fill="none" stroke="#B84021" stroke-width="0.8" opacity="0.55"/>
      <rect x="18" y="38" width="195" height="18" rx="5" fill="#B84021" opacity="0.18"/>
      <text x="115" y="51" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#EDE3CF" letter-spacing="1">ME SECTION A PORTAL</text>
      <circle cx="28" cy="47" r="3" fill="#B84021" opacity="0.8"/>
      <text x="30" y="74" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">Role-based portal for</text>
      <text x="30" y="86" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">~48 students. Three.js</text>
      <text x="30" y="98" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">3D + glassmorphism UI.</text>
      <text x="30" y="110" font-family="'Courier New', monospace" font-size="8" fill="#D4903A">JS · Three.js · Node.js</text>
      <rect x="140" y="126" width="66" height="12" rx="3" fill="#1D9E75" opacity="0.25"/>
      <text x="173" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#1D9E75">● LIVE</text>
    </g>

    <!-- Card 2: Gesture Whiteboard -->
    <g class="proj3">
      <rect x="228" y="38" width="195" height="106" rx="5" fill="#0C0A08" opacity="0.8"/>
      <rect x="228" y="38" width="195" height="106" rx="5" fill="none" stroke="#2BBFB0" stroke-width="0.8" opacity="0.5"/>
      <rect x="228" y="38" width="195" height="18" rx="5" fill="#2BBFB0" opacity="0.12"/>
      <text x="325" y="51" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#EDE3CF" letter-spacing="1">GESTURE WHITEBOARD</text>
      <circle cx="238" cy="47" r="3" fill="#2BBFB0" opacity="0.8"/>
      <text x="240" y="74" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">Hand-gesture driven</text>
      <text x="240" y="86" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">zero-touch whiteboard.</text>
      <text x="240" y="98" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">MediaPipe Hands + Canvas.</text>
      <text x="240" y="110" font-family="'Courier New', monospace" font-size="8" fill="#2BBFB0">Python · MediaPipe · Canvas</text>
      <rect x="340" y="126" width="76" height="12" rx="3" fill="#378ADD" opacity="0.2"/>
      <text x="378" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#378ADD">● COMPLETE</text>
    </g>

    <!-- Card 3: Doc Suite -->
    <g class="proj3">
      <rect x="438" y="38" width="200" height="106" rx="5" fill="#0C0A08" opacity="0.8"/>
      <rect x="438" y="38" width="200" height="106" rx="5" fill="none" stroke="#D4903A" stroke-width="0.8" opacity="0.5"/>
      <rect x="438" y="38" width="200" height="18" rx="5" fill="#D4903A" opacity="0.12"/>
      <text x="538" y="51" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#EDE3CF" letter-spacing="1">ENGINEERING DOC SUITE</text>
      <circle cx="448" cy="47" r="3" fill="#D4903A" opacity="0.8"/>
      <text x="450" y="74" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">Production-grade docs:</text>
      <text x="450" y="86" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">EM-II Lab Reports, MoM</text>
      <text x="450" y="98" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">PEC/BOD/2026/Q2-01</text>
      <text x="450" y="110" font-family="'Courier New', monospace" font-size="8" fill="#D4903A">Node.js · docx · XML</text>
      <rect x="550" y="126" width="80" height="12" rx="3" fill="#1D9E75" opacity="0.25"/>
      <text x="590" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#1D9E75">● DELIVERED</text>
    </g>

    <!-- Card 4: Claude Cert -->
    <g class="proj4">
      <rect x="654" y="38" width="228" height="106" rx="5" fill="#0C0A08" opacity="0.8"/>
      <rect x="654" y="38" width="228" height="106" rx="5" fill="none" stroke="#B84021" stroke-width="0.8" opacity="0.5"/>
      <rect x="654" y="38" width="228" height="18" rx="5" fill="#B84021" opacity="0.15"/>
      <text x="768" y="51" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#EDE3CF" letter-spacing="1">CLAUDE 101 CERT — ENHANCED</text>
      <circle cx="664" cy="47" r="3" fill="#D4903A" opacity="0.8"/>
      <text x="666" y="74" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">Anthropic Claude 101.</text>
      <text x="666" y="86" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">Redesigned into luxury</text>
      <text x="666" y="98" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">HTML/CSS/SVG document.</text>
      <text x="666" y="110" font-family="'Courier New', monospace" font-size="8" fill="#B84021">HTML · CSS · SVG</text>
      <rect x="754" y="126" width="76" height="12" rx="3" fill="#378ADD" opacity="0.2"/>
      <text x="792" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#378ADD">● COMPLETE</text>
    </g>
  </g>
</svg>
