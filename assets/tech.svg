<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      @keyframes gridPulse { 0%,100%{opacity:0.18;} 50%{opacity:0.38;} }
      @keyframes nodePulse { 0%,100%{r:2; opacity:0.6;} 50%{r:4; opacity:1;} }
      @keyframes dash { from{stroke-dashoffset:100;} to{stroke-dashoffset:0;} }
      @keyframes fadeSlide { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
      @keyframes rotate-slow { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
      @keyframes rotate-rev  { from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
      @keyframes drift { 0%,100%{transform:translate(0,0);} 50%{transform:translate(12px,-8px);} }
      .t1{animation:fadeSlide 0.8s ease-out 0.1s both;}
      .t2{animation:fadeSlide 0.8s ease-out 0.3s both;}
      .t3{animation:fadeSlide 0.8s ease-out 0.5s both;}
    </style>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#060507"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
    <radialGradient id="rg4" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#B84021" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg5" cx="5%" cy="50%" r="30%">
      <stop offset="0%"  stop-color="#D4903A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg6" cx="95%" cy="50%" r="30%">
      <stop offset="0%"  stop-color="#2BBFB0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#D4903A" stroke-width="0.35" opacity="0.22"/>
    </pattern>
    <filter id="glow3"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="glow6"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip3"><rect width="900" height="160"/></clipPath>
  </defs>

  <g clip-path="url(#clip3)">
    <rect width="900" height="160" fill="url(#bg3)"/>
    <rect width="900" height="160" fill="url(#techGrid)" style="animation:gridPulse 4s ease-in-out infinite;"/>
    <rect width="900" height="160" fill="url(#rg4)"/>
    <rect width="900" height="160" fill="url(#rg5)"/>
    <rect width="900" height="160" fill="url(#rg6)"/>

    <!-- Grid intersection nodes -->
    <circle cx="0"   cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 0s;"/>
    <circle cx="90"  cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 0.5s;"/>
    <circle cx="180" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 1s;"/>
    <circle cx="270" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 1.5s;"/>
    <circle cx="360" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 2s;"/>
    <circle cx="450" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 0.3s;"/>
    <circle cx="540" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 0.8s;"/>
    <circle cx="630" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 1.3s;"/>
    <circle cx="720" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 1.8s;"/>
    <circle cx="810" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 0.6s;"/>
    <circle cx="900" cy="0"   r="2" fill="#D4903A" style="animation:nodePulse 3s ease-in-out infinite 2.2s;"/>
    <circle cx="0"   cy="160" r="2" fill="#2BBFB0" style="animation:nodePulse 3.5s ease-in-out infinite 0.4s;"/>
    <circle cx="900" cy="160" r="2" fill="#2BBFB0" style="animation:nodePulse 3.5s ease-in-out infinite 1.4s;"/>

    <!-- Animated data-flow lines -->
    <line x1="0" y1="80" x2="900" y2="80" stroke="#B84021" stroke-width="0.4" stroke-dasharray="8 16" opacity="0.3">
      <animate attributeName="stroke-dashoffset" values="0;-240" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="40" x2="900" y2="40" stroke="#2BBFB0" stroke-width="0.3" stroke-dasharray="4 20" opacity="0.2">
      <animate attributeName="stroke-dashoffset" values="240;0" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#D4903A" stroke-width="0.3" stroke-dasharray="3 24" opacity="0.18">
      <animate attributeName="stroke-dashoffset" values="0;-120" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- Traveling dot on line -->
    <circle cx="0" cy="80" r="3" fill="#B84021" opacity="0.9" filter="url(#glow3)">
      <animate attributeName="cx" values="0;900" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="40" r="2.5" fill="#2BBFB0" opacity="0.85" filter="url(#glow3)">
      <animate attributeName="cx" values="900;0" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Corner rotating rings -->
    <g transform="translate(30,30)">
      <g style="transform-origin:0 0; animation:rotate-slow 12s linear infinite;">
        <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="none" stroke="#D4903A" stroke-width="0.7" opacity="0.4"/>
      </g>
    </g>
    <g transform="translate(870,30)">
      <g style="transform-origin:0 0; animation:rotate-rev 10s linear infinite;">
        <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="none" stroke="#2BBFB0" stroke-width="0.7" opacity="0.4"/>
      </g>
    </g>
    <g transform="translate(30,130)">
      <g style="transform-origin:0 0; animation:rotate-rev 15s linear infinite;">
        <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#B84021" stroke-width="0.7" opacity="0.35"/>
      </g>
    </g>
    <g transform="translate(870,130)">
      <g style="transform-origin:0 0; animation:rotate-slow 18s linear infinite;">
        <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="none" stroke="#D4903A" stroke-width="0.7" opacity="0.35"/>
      </g>
    </g>

    <!-- Border lines -->
    <line x1="0" y1="1" x2="900" y2="1" stroke="#B84021" stroke-width="1" opacity="0.55"/>
    <line x1="0" y1="159" x2="900" y2="159" stroke="#D4903A" stroke-width="0.6" opacity="0.4"/>

    <!-- Section header -->
    <text x="450" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="11"
          fill="#B84021" letter-spacing="6" class="t1">⬡  TECH STACK &amp; TOOLS  ⬡</text>

    <!-- Category row -->
    <g class="t2">
      <!-- Languages -->
      <rect x="60" y="52" width="155" height="22" rx="3" fill="#B84021" opacity="0.12"/>
      <rect x="60" y="52" width="155" height="22" rx="3" fill="none" stroke="#B84021" stroke-width="0.7" opacity="0.5"/>
      <text x="137" y="67" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#EDE3CF" letter-spacing="2">LANGUAGES</text>
      <text x="137" y="90" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#D4903A">Python · JS · HTML · CSS</text>

      <!-- Frameworks -->
      <rect x="245" y="52" width="175" height="22" rx="3" fill="#2BBFB0" opacity="0.1"/>
      <rect x="245" y="52" width="175" height="22" rx="3" fill="none" stroke="#2BBFB0" stroke-width="0.7" opacity="0.45"/>
      <text x="332" y="67" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#EDE3CF" letter-spacing="2">FRAMEWORKS</text>
      <text x="332" y="90" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#2BBFB0">Node.js · React · Three.js</text>

      <!-- Tools -->
      <rect x="450" y="52" width="175" height="22" rx="3" fill="#D4903A" opacity="0.1"/>
      <rect x="450" y="52" width="175" height="22" rx="3" fill="none" stroke="#D4903A" stroke-width="0.7" opacity="0.45"/>
      <text x="537" y="67" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#EDE3CF" letter-spacing="2">TOOLS</text>
      <text x="537" y="90" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#D4903A">Git · GitHub · VS Code</text>

      <!-- Specialties -->
      <rect x="655" y="52" width="185" height="22" rx="3" fill="#B84021" opacity="0.12"/>
      <rect x="655" y="52" width="185" height="22" rx="3" fill="none" stroke="#B84021" stroke-width="0.7" opacity="0.5"/>
      <text x="747" y="67" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#EDE3CF" letter-spacing="2">SPECIALTIES</text>
      <text x="747" y="90" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#B84021">Figma · MediaPipe · docx</text>
    </g>

    <!-- Skills bar area -->
    <g class="t3">
      <text x="450" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#5C6E7A" letter-spacing="3">── PROFICIENCY ──</text>

      <!-- Bars -->
      <!-- Python -->
      <text x="100" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">Python</text>
      <rect x="60" y="143" width="80" height="4" rx="2" fill="#1A1208" opacity="0.9"/>
      <rect x="60" y="143" width="68" height="4" rx="2" fill="#D4903A" opacity="0.8">
        <animate attributeName="width" values="0;68" dur="1.5s" fill="freeze"/>
      </rect>

      <!-- JavaScript -->
      <text x="230" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">JavaScript</text>
      <rect x="188" y="143" width="84" height="4" rx="2" fill="#1A1208" opacity="0.9"/>
      <rect x="188" y="143" width="66" height="4" rx="2" fill="#B84021" opacity="0.8">
        <animate attributeName="width" values="0;66" dur="1.5s" begin="0.2s" fill="freeze"/>
      </rect>

      <!-- Three.js -->
      <text x="380" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">Three.js</text>
      <rect x="338" y="143" width="84" height="4" rx="2" fill="#1A1208" opacity="0.9"/>
      <rect x="338" y="143" width="70" height="4" rx="2" fill="#2BBFB0" opacity="0.8">
        <animate attributeName="width" values="0;70" dur="1.5s" begin="0.4s" fill="freeze"/>
      </rect>

      <!-- Tech Writing -->
      <text x="540" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">Tech Writing</text>
      <rect x="493" y="143" width="94" height="4" rx="2" fill="#1A1208" opacity="0.9"/>
      <rect x="493" y="143" width="88" height="4" rx="2" fill="#D4903A" opacity="0.8">
        <animate attributeName="width" values="0;88" dur="1.5s" begin="0.6s" fill="freeze"/>
      </rect>

      <!-- AI/Prompting -->
      <text x="720" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#8CA5B5">AI / Prompting</text>
      <rect x="666" y="143" width="108" height="4" rx="2" fill="#1A1208" opacity="0.9"/>
      <rect x="666" y="143" width="82" height="4" rx="2" fill="#B84021" opacity="0.8">
        <animate attributeName="width" values="0;82" dur="1.5s" begin="0.8s" fill="freeze"/>
      </rect>
    </g>
  </g>
</svg>
