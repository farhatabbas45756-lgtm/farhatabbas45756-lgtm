<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <style>
      @keyframes orb1 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(20px,-14px) scale(1.1);} 66%{transform:translate(-10px,18px) scale(0.92);} }
      @keyframes orb2 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-22px,16px);} }
      @keyframes orb3 { 0%,100%{transform:translate(0,0) scale(1);} 40%{transform:translate(14px,-18px) scale(1.08);} 80%{transform:translate(-16px,8px) scale(0.95);} }
      @keyframes rotate-slow { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
      @keyframes rotate-rev  { from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
      @keyframes fadeIn { from{opacity:0;transform:translateX(-15px);} to{opacity:1;transform:translateX(0);} }
      @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
      @keyframes lineAnim { 0%,100%{opacity:0.15;} 50%{opacity:0.45;} }
      .o1{animation:orb1 8s ease-in-out infinite; transform-origin:inherit;}
      .o2{animation:orb2 11s ease-in-out infinite; transform-origin:inherit;}
      .o3{animation:orb3 9s ease-in-out infinite 2s; transform-origin:inherit;}
      .t1{animation:fadeIn 0.9s ease-out 0.2s both;}
      .t2{animation:fadeIn 0.9s ease-out 0.5s both;}
      .t3{animation:fadeIn 0.9s ease-out 0.8s both;}
      .t4{animation:fadeIn 0.9s ease-out 1.1s both;}
    </style>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#080806"/>
      <stop offset="50%"  stop-color="#0E0B08"/>
      <stop offset="100%" stop-color="#070608"/>
    </linearGradient>
    <radialGradient id="rg1" cx="15%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#B84021" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0C0A08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#2BBFB0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0C0A08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg3" cx="50%" cy="10%" r="35%">
      <stop offset="0%" stop-color="#D4903A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0C0A08" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#D4903A" opacity="0.22"/>
    </pattern>
    <filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip2"><rect width="900" height="180"/></clipPath>
  </defs>

  <g clip-path="url(#clip2)">
    <rect width="900" height="180" fill="url(#bg2)"/>
    <rect width="900" height="180" fill="url(#dots2)"/>
    <rect width="900" height="180" fill="url(#rg1)"/>
    <rect width="900" height="180" fill="url(#rg2)"/>
    <rect width="900" height="180" fill="url(#rg3)"/>

    <!-- Floating orbs -->
    <g class="o1" style="transform-origin:80px 90px;">
      <circle cx="80" cy="90" r="70" fill="#B84021" opacity="0.07" filter="url(#b6)"/>
      <circle cx="80" cy="90" r="35" fill="#B84021" opacity="0.09" filter="url(#b3)"/>
    </g>
    <g class="o2" style="transform-origin:820px 90px;">
      <circle cx="820" cy="90" r="65" fill="#2BBFB0" opacity="0.07" filter="url(#b6)"/>
      <circle cx="820" cy="90" r="30" fill="#2BBFB0" opacity="0.1" filter="url(#b3)"/>
    </g>
    <g class="o3" style="transform-origin:450px 160px;">
      <circle cx="450" cy="160" r="55" fill="#D4903A" opacity="0.08" filter="url(#b6)"/>
    </g>

    <!-- Rotating rings -->
    <g transform="translate(80,90)">
      <g style="transform-origin:0 0; animation:rotate-slow 20s linear infinite;">
        <circle cx="0" cy="0" r="55" fill="none" stroke="#B84021" stroke-width="0.6" stroke-dasharray="6 12" opacity="0.35"/>
      </g>
      <g style="transform-origin:0 0; animation:rotate-rev 28s linear infinite;">
        <circle cx="0" cy="0" r="72" fill="none" stroke="#D4903A" stroke-width="0.4" stroke-dasharray="3 15" opacity="0.2"/>
      </g>
    </g>
    <g transform="translate(820,90)">
      <g style="transform-origin:0 0; animation:rotate-rev 22s linear infinite;">
        <circle cx="0" cy="0" r="50" fill="none" stroke="#2BBFB0" stroke-width="0.6" stroke-dasharray="5 10" opacity="0.3"/>
      </g>
    </g>

    <!-- Horizontal accent lines -->
    <line x1="0" y1="1" x2="900" y2="1" stroke="#B84021" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="3" x2="900" y2="3" stroke="#D4903A" stroke-width="0.3" opacity="0.25"/>
    <line x1="0" y1="177" x2="900" y2="177" stroke="#2BBFB0" stroke-width="0.6" opacity="0.4"/>

    <!-- Section label -->
    <text x="32" y="35" font-family="'Courier New', monospace" font-size="10" fill="#B84021" opacity="0.7" letter-spacing="4" class="t1">◈  ABOUT</text>

    <!-- Terminal box -->
    <g class="t2">
      <rect x="32" y="48" width="836" height="112" rx="6" fill="#0C0A08" opacity="0.7"/>
      <rect x="32" y="48" width="836" height="112" rx="6" fill="none" stroke="#B84021" stroke-width="0.8" opacity="0.4"/>
      <!-- Traffic lights -->
      <circle cx="52" cy="62" r="4" fill="#B84021" opacity="0.8"/>
      <circle cx="67" cy="62" r="4" fill="#D4903A" opacity="0.8"/>
      <circle cx="82" cy="62" r="4" fill="#2BBFB0" opacity="0.8"/>
      <line x1="32" y1="72" x2="868" y2="72" stroke="#B84021" stroke-width="0.5" opacity="0.3"/>
    </g>

    <!-- Terminal content -->
    <text x="52" y="94" font-family="'Courier New', monospace" font-size="11" fill="#D4903A" class="t3">
      <tspan fill="#2BBFB0">$</tspan>  whoami
    </text>
    <g class="t4">
      <text x="52" y="112" font-family="'Courier New', monospace" font-size="11" fill="#8CA5B5">
        <tspan fill="#B84021">→</tspan>  Farhat Abbas · ME Student · UET Lahore · Batch 2025 · Roll 2025-ME-33
      </text>
      <text x="52" y="128" font-family="'Courier New', monospace" font-size="11" fill="#8CA5B5">
        <tspan fill="#B84021">→</tspan>  Super Admin @ ME Section A  ·  Science Society Documentation  ·  PRECIX Technical Writer
      </text>
      <text x="52" y="144" font-family="'Courier New', monospace" font-size="11" fill="#8CA5B5">
        <tspan fill="#D4903A">█</tspan><tspan fill="#D4903A" style="animation:blink 1.1s step-end infinite;">_</tspan>
      </text>
    </g>
  </g>
</svg>
