<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <style>
      @keyframes helixMove {
        from { transform: translateX(0); }
        to   { transform: translateX(-60px); }
      }
      @keyframes helixMove2 {
        from { transform: translateX(-60px); }
        to   { transform: translateX(0px); }
      }
      @keyframes rotate-slow { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
      @keyframes rotate-rev  { from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
      @keyframes pulse { 0%,100%{opacity:0.7;r:3;} 50%{opacity:1;r:5;} }
      @keyframes fadeInRight { from{opacity:0;transform:translateX(-20px);} to{opacity:1;transform:translateX(0);} }
      @keyframes shimmer { 0%,100%{opacity:0.8;} 50%{opacity:1;} }
      @keyframes starTwinkle { 0%,100%{opacity:0.2;r:1;} 50%{opacity:0.9;r:2;} }
      .c1{animation:fadeInRight 0.8s ease-out 0.2s both;}
      .c2{animation:fadeInRight 0.8s ease-out 0.5s both;}
      .c3{animation:fadeInRight 0.8s ease-out 0.8s both;}
    </style>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060508"/>
      <stop offset="50%" stop-color="#0A0807"/>
      <stop offset="100%" stop-color="#060507"/>
    </linearGradient>
    <radialGradient id="rg9" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#B84021" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg10" cx="5%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#D4903A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg11" cx="95%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#2BBFB0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#060507" stop-opacity="0"/>
    </radialGradient>
    <filter id="bh"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="bh2"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip5"><rect width="900" height="180"/></clipPath>
  </defs>

  <g clip-path="url(#clip5)">
    <rect width="900" height="180" fill="url(#bg5)"/>
    <rect width="900" height="180" fill="url(#rg9)"/>
    <rect width="900" height="180" fill="url(#rg10)"/>
    <rect width="900" height="180" fill="url(#rg11)"/>

    <!-- DNA Helix Animation (left column) -->
    <!-- The helix is constructed as two sine-wave strands with connecting rungs -->
    <g style="animation:helixMove 3s linear infinite; transform-origin:0 0;" opacity="0.35">
      <!-- Strand 1 (orange) -->
      <path d="M-60,10 Q-30,0 0,90 Q30,180 60,90 Q90,0 120,90 Q150,180 180,90 Q210,0 240,90" fill="none" stroke="#D4903A" stroke-width="1.5"/>
      <!-- Strand 2 (teal) -->
      <path d="M-60,170 Q-30,180 0,90 Q30,0 60,90 Q90,180 120,90 Q150,0 180,90 Q210,180 240,90" fill="none" stroke="#2BBFB0" stroke-width="1.5"/>
      <!-- Rungs -->
      <line x1="-30"  y1="15" x2="-30"  y2="165" stroke="#B84021" stroke-width="0.6" opacity="0.5"/>
      <line x1="0"    y1="90" x2="0"    y2="90"   stroke="#B84021" stroke-width="1"   opacity="0.8"/>
      <line x1="30"   y1="165" x2="30"  y2="15"   stroke="#B84021" stroke-width="0.6" opacity="0.5"/>
      <line x1="60"   y1="90" x2="60"   y2="90"   stroke="#B84021" stroke-width="1"   opacity="0.8"/>
      <line x1="90"   y1="15" x2="90"   y2="165"  stroke="#B84021" stroke-width="0.6" opacity="0.5"/>
      <line x1="120"  y1="90" x2="120"  y2="90"   stroke="#B84021" stroke-width="1"   opacity="0.8"/>
      <line x1="150"  y1="165" x2="150" y2="15"   stroke="#B84021" stroke-width="0.6" opacity="0.5"/>
      <line x1="180"  y1="90" x2="180"  y2="90"   stroke="#B84021" stroke-width="1"   opacity="0.8"/>
    </g>

    <!-- Stars / sparkles background -->
    <circle cx="200"  cy="15"  r="1" fill="#EDE3CF" style="animation:starTwinkle 2s ease-in-out infinite 0.3s;"/>
    <circle cx="350"  cy="28"  r="1" fill="#D4903A" style="animation:starTwinkle 2.5s ease-in-out infinite 0.8s;"/>
    <circle cx="520"  cy="12"  r="1" fill="#2BBFB0" style="animation:starTwinkle 3s ease-in-out infinite 1.2s;"/>
    <circle cx="680"  cy="22"  r="1" fill="#EDE3CF" style="animation:starTwinkle 2.2s ease-in-out infinite 0.5s;"/>
    <circle cx="820"  cy="18"  r="1" fill="#D4903A" style="animation:starTwinkle 1.8s ease-in-out infinite 1.5s;"/>
    <circle cx="760"  cy="160" r="1" fill="#2BBFB0" style="animation:starTwinkle 2.8s ease-in-out infinite 0.2s;"/>
    <circle cx="430"  cy="170" r="1" fill="#EDE3CF" style="animation:starTwinkle 2.1s ease-in-out infinite 1s;"/>
    <circle cx="260"  cy="155" r="1" fill="#B84021" style="animation:starTwinkle 3.2s ease-in-out infinite 0.7s;"/>

    <!-- Rotating decoration rings -->
    <g transform="translate(860,90)">
      <g style="transform-origin:0 0; animation:rotate-slow 18s linear infinite;">
        <circle cx="0" cy="0" r="45" fill="none" stroke="#2BBFB0" stroke-width="0.6" stroke-dasharray="5 10" opacity="0.3"/>
      </g>
      <g style="transform-origin:0 0; animation:rotate-rev 24s linear infinite;">
        <circle cx="0" cy="0" r="60" fill="none" stroke="#D4903A" stroke-width="0.4" stroke-dasharray="3 15" opacity="0.2"/>
      </g>
    </g>

    <!-- Border -->
    <line x1="0" y1="1"   x2="900" y2="1"   stroke="#B84021" stroke-width="1" opacity="0.55"/>
    <line x1="0" y1="179" x2="900" y2="179" stroke="#D4903A" stroke-width="0.6" opacity="0.4"/>

    <!-- Content area -->
    <!-- Section label -->
    <text x="450" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="11"
          fill="#D4903A" letter-spacing="6" class="c1">🎓  CERTIFICATION  🎓</text>

    <!-- Large cert card -->
    <g class="c2">
      <rect x="180" y="40" width="540" height="124" rx="8" fill="#0C0A08" opacity="0.82"/>
      <rect x="180" y="40" width="540" height="124" rx="8" fill="none" stroke="#D4903A" stroke-width="1" opacity="0.5"/>
      <!-- Gold top accent -->
      <rect x="180" y="40" width="540" height="4" rx="2" fill="#D4903A" opacity="0.55"/>
      <!-- Left AI icon block -->
      <rect x="198" y="60" width="70" height="88" rx="5" fill="#B84021" opacity="0.12"/>
      <rect x="198" y="60" width="70" height="88" rx="5" fill="none" stroke="#B84021" stroke-width="0.6" opacity="0.4"/>
      <text x="233" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="32" fill="#D4903A" style="animation:shimmer 2s ease-in-out infinite;">🤖</text>
    </g>

    <!-- Cert text -->
    <g class="c3">
      <text x="285" y="62" font-family="'Courier New', monospace" font-size="8" fill="#5C6E7A" letter-spacing="4">ANTHROPIC  ·  OFFICIAL</text>
      <text x="285" y="82" font-family="'Courier New', monospace" font-size="17" font-weight="900" fill="#EDE3CF" letter-spacing="1">Claude 101</text>
      <text x="285" y="99" font-family="'Courier New', monospace" font-size="11" fill="#D4903A" letter-spacing="2">AI FUNDAMENTALS</text>

      <line x1="285" y1="108" x2="700" y2="108" stroke="#B84021" stroke-width="0.5" opacity="0.4"/>

      <text x="285" y="122" font-family="'Courier New', monospace" font-size="9" fill="#8CA5B5">
        Prompt Engineering  ·  Responsible AI  ·  LLM Fundamentals  ·  Claude Best Practices
      </text>
      <text x="285" y="138" font-family="'Courier New', monospace" font-size="9" fill="#8CA5B5">
        Certificate enhanced → Luxury-styled HTML / CSS / SVG document with refined typography
      </text>

      <!-- Badges -->
      <rect x="285" y="148" width="80" height="12" rx="3" fill="#D4903A" opacity="0.18"/>
      <text x="325" y="157" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#D4903A">Anthropic</text>

      <rect x="374" y="148" width="80" height="12" rx="3" fill="#2BBFB0" opacity="0.15"/>
      <text x="414" y="157" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#2BBFB0">HTML/SVG</text>

      <rect x="463" y="148" width="90" height="12" rx="3" fill="#B84021" opacity="0.18"/>
      <text x="508" y="157" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#B84021">Luxury Design</text>

      <!-- Verified star -->
      <text x="680" y="110" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" fill="#D4903A" style="animation:pulse 2.5s ease-in-out infinite; transform-origin:680px 100px;">★</text>
    </g>
  </g>
</svg>
